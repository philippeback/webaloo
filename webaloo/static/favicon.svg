<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="webaloo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#webaloo-grad)"/>
  <!-- 2x2 grid representing tiles (Symbaloo/Webaloo layout) -->
  <g fill="#ffffff" filter="url(#shadow)">
    <rect x="14" y="14" width="15" height="15" rx="3.5" fill-opacity="0.95"/>
    <rect x="35" y="14" width="15" height="15" rx="3.5" fill-opacity="0.85"/>
    <rect x="14" y="35" width="15" height="15" rx="3.5" fill-opacity="0.85"/>
    <rect x="35" y="35" width="15" height="15" rx="3.5" fill-opacity="0.95"/>
  </g>
</svg>
